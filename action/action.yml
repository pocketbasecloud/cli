name: "Deploy to PocketBase Cloud"
description: "Deploy a PocketBase instance, backend, or static site to PocketBase Cloud with the pbc CLI."
author: "PocketBase Cloud"

branding:
  icon: "upload-cloud"
  color: "orange"

inputs:
  token:
    description: >-
      A PocketBase Cloud access token. Copy it from the portal's Account page,
      store it as a repository secret named PBC_TOKEN, and pass that secret in.
    required: true
  kind:
    description: >-
      What to deploy: auto, pb, frontend, or backend. auto lets the CLI decide
      from pbc.json and the directory's contents.
    required: false
    default: "auto"
  working-directory:
    description: "The directory holding pbc.json. Defaults to the repository root."
    required: false
    default: "."
  cli-version:
    description: >-
      Version of pbc to install. Defaults to the version this
      action shipped with; pinning both together is the point of the tag.
      Installed from GitHub release assets via scripts/install.sh.
    required: false
    # Must equal VERSION in src/version.ts — tests/unit/action.test.ts enforces it.
    default: "0.8.6"
  project:
    description: "Project name or id. Only needed when pbc.json is not committed."
    required: false
    default: ""
  name:
    description: "Resource name. Only needed when pbc.json does not name one."
    required: false
    default: ""
  env:
    description: "pbc.json environment to deploy. Defaults to the file's defaultEnvironment."
    required: false
    default: ""
  compute:
    description: "Compute id to deploy onto. Pro accounts with more than one compute."
    required: false
    default: ""
  location:
    description: "Region code for a first deploy. Run 'pbc cloud locations' to list them."
    required: false
    default: ""
  skip-build:
    description: "Upload what is already built instead of running the build step."
    required: false
    default: "false"
  args:
    description: >-
      Extra flags appended to the deploy command. Split with shell quoting
      rules, so --name "My Site" stays one argument.
    required: false
    default: ""

outputs:
  url:
    description: "The deployed resource's URL."
    value: ${{ steps.result.outputs.url }}
  id:
    description: "The resource's platform id."
    value: ${{ steps.result.outputs.id }}
  name:
    description: "The resource's name."
    value: ${{ steps.result.outputs.name }}
  status:
    description: "The resource's status after the deploy."
    value: ${{ steps.result.outputs.status }}
  kind:
    description: "pb, frontend, or backend — resolved when the input was auto."
    value: ${{ steps.result.outputs.kind }}
  environment:
    description: "The pbc.json environment that was deployed."
    value: ${{ steps.result.outputs.environment }}

runs:
  using: "composite"
  steps:
    # Everything that can be known before the network is touched. A fork's
    # pull_request job gets no secrets at all, so an empty token is a common
    # and confusing failure that deserves its own sentence.
    - name: Preflight
      shell: bash
      env:
        PBC_TOKEN: ${{ inputs.token }}
        PBC_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        if [ -z "${PBC_TOKEN}" ]; then
          echo "::error::No token. Set 'token' to a repository secret holding a PocketBase Cloud access token (portal -> Account -> CLI access token). GitHub does not pass secrets to pull_request jobs from a fork, so those runs always see an empty value."
          exit 4
        fi
        case "${PBC_KIND}" in
          auto|pb|frontend|backend) ;;
          *) echo "::error::kind must be one of: auto, pb, frontend, backend (got '${PBC_KIND}')."; exit 2 ;;
        esac
        if ! command -v curl >/dev/null 2>&1; then
          echo "::error::curl is not on PATH. This action installs the pbc CLI from GitHub releases; add curl to the runner."
          exit 1
        fi

    # Pinned on purpose: an unpinned install makes every run depend on whatever
    # was published that morning. Installs from GitHub release assets; npm is
    # deprecated. The dir is exported to later steps through GITHUB_PATH —
    # each step runs in a fresh shell, so an in-step PATH export alone would
    # not carry over to the deploy below.
    - name: Install pbc
      shell: bash
      env:
        PBC_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [ -w /usr/local/bin ]; then
          export PBC_INSTALL_DIR=/usr/local/bin
        else
          export PBC_INSTALL_DIR="$HOME/.local/bin"
        fi
        export PATH="$PBC_INSTALL_DIR:$PATH"
        echo "$PBC_INSTALL_DIR" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/pocketbasecloud/cli/main/scripts/install.sh | PBC_VERSION="${PBC_CLI_VERSION}" sh
        pbc --version

    # The cheapest possible check, and it runs before the build: a missing or
    # expired token fails here in a second rather than after a five-minute
    # build.
    - name: Verify token
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PBC_TOKEN: ${{ inputs.token }}
      run: pbc cloud whoami --json > /dev/null

    - name: Deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PBC_TOKEN: ${{ inputs.token }}
        PBC_KIND: ${{ inputs.kind }}
        PBC_PROJECT: ${{ inputs.project }}
        PBC_NAME: ${{ inputs.name }}
        PBC_ENVIRONMENT: ${{ inputs.env }}
        PBC_COMPUTE: ${{ inputs.compute }}
        PBC_LOCATION: ${{ inputs.location }}
        PBC_SKIP_BUILD: ${{ inputs.skip-build }}
        PBC_EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        argv=(cloud)
        if [ "${PBC_KIND}" = "auto" ]; then
          argv+=(deploy)
        else
          argv+=("${PBC_KIND}" deploy)
        fi
        if [ -n "${PBC_PROJECT}" ]; then argv+=(--project "${PBC_PROJECT}"); fi
        if [ -n "${PBC_NAME}" ]; then argv+=(--name "${PBC_NAME}"); fi
        if [ -n "${PBC_ENVIRONMENT}" ]; then argv+=(--env "${PBC_ENVIRONMENT}"); fi
        if [ -n "${PBC_COMPUTE}" ]; then argv+=(--compute "${PBC_COMPUTE}"); fi
        if [ -n "${PBC_LOCATION}" ]; then argv+=(--location "${PBC_LOCATION}"); fi
        if [ "${PBC_SKIP_BUILD}" = "true" ]; then argv+=(--skip-build); fi
        if [ -n "${PBC_EXTRA_ARGS}" ]; then
          # `xargs` honours quoting, so --name "My Site" stays one argument.
          # A bare `read -a` splits on whitespace alone and would hand pbc the
          # three tokens --name, "My and Site". Not `eval`: this value can come
          # from a workflow expression, and eval would run what is inside it.
          #
          # Assigned, never read straight from `< <(...)`: a process
          # substitution's exit status is not the shell's, so an unbalanced
          # quote left xargs dead after emitting a partial list and the deploy
          # ran on it — `--name` swallowing the next flag as its value.
          if ! split="$(printf '%s' "${PBC_EXTRA_ARGS}" | xargs -n1 printf '%s\n')"; then
            echo "::error::Could not read 'args' — check that its quotes are balanced."
            exit 2
          fi
          if [ -n "${split}" ]; then
            while IFS= read -r one; do argv+=("${one}"); done <<< "${split}"
          fi
        fi
        argv+=(--no-input --json)
        # Redirect, never pipe: in a pipeline $? is the *last* command's status,
        # so a failed deploy piped anywhere would report success.
        pbc "${argv[@]}" > "${RUNNER_TEMP}/pbc-deploy.json"

    # Masks first, then reads. A PocketBase deploy's record carries
    # adminUsername/adminPassword, and GitHub only hides values it has been
    # told are secret.
    - name: Publish outputs
      id: result
      shell: bash
      env:
        PBC_KIND: ${{ inputs.kind }}
      run: node "${GITHUB_ACTION_PATH}/summarize.mjs" "${RUNNER_TEMP}/pbc-deploy.json"

    # The deploy record never outlives the job, so no later upload-artifact
    # step can carry it out of here.
    - name: Remove the deploy record
      if: always()
      shell: bash
      run: rm -f "${RUNNER_TEMP}/pbc-deploy.json"
